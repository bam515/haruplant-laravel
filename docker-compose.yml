version: "3.8"

services:
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: haruplant-haruplant
    working_dir: /var/www
    volumes:
      - ./haruplant:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: php artisan serve --host=0.0.0.0 --port=8000

  db:
    image: mysql:8.0
    container_name: haruplant-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: haruplant
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
